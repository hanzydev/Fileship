appId: dev.hanzy.fileship
productName: Fileship
extraMetadata:
    name: Fileship
copyright: Copyright © 2024-present Hànzy and Fileship contributors

directories:
    output: release
    buildResources: build

files:
    - dist-electron/**
    - .output/public/**
    - resources/**
    - package.json

extraResources:
    - from: build/harbor/fileship-harbor.exe
      to: harbor/fileship-harbor.exe
    - from: build/harbor/icons
      to: harbor/icons
    - from: build/host
      to: host
      filter:
          - fileship-host.exe
          - i18n/**
          - fonts/**
          - settings-defaults.json
          - settings-schema.json
    - from: resources/shutter.wav
      to: host/sounds/shutter.wav
    - from: resources/uploaded.wav
      to: host/sounds/uploaded.wav

electronFuses:
    runAsNode: false
    enableNodeOptionsEnvironmentVariable: false
    enableNodeCliInspectArguments: false

npmRebuild: false
nodeGypRebuild: false

win:
    target:
        - target: nsis
          arch: [x64]
    icon: build/icon.ico
    artifactName: Fileship-Setup-${version}.${ext}

nsis:
    oneClick: true
    perMachine: false
    shortcutName: Fileship
    uninstallDisplayName: Fileship
    deleteAppDataOnUninstall: false

publish:
    provider: github
    owner: hanzydev
    repo: fileship-desktop
    releaseType: release
