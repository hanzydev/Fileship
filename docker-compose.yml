services:
    postgres:
        image: postgres:16.9
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: postgres
        volumes:
            - pg_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 10s
            timeout: 5s
            retries: 5

    fileship:
        image: ghcr.io/hanzydev/fileship:latest
        ports:
            - '3000:3000'
        restart: unless-stopped
        environment:
            HOST: 0.0.0.0
            PORT: 3000
            DATABASE_URL: postgres://postgres:postgres@postgres/postgres
            UPDATER_URL: http://updater-agent:3001
            UPDATER_SECRET: ${SECRET_TOKEN}
        volumes:
            - ./data:/fileship/data
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/healthz').then(r => process.exitCode = r.ok ? 0 : 1).catch(() => process.exitCode = 1)"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 15s

    updater-agent:
        image: ghcr.io/hanzydev/fileship-updater-agent:latest
        restart: unless-stopped
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - ./docker-compose.yml:/fileship/docker-compose.yml
        environment:
            DEV_MODE: false
            AUTOUPDATER_ENABLED: true
            SECRET_TOKEN: ${SECRET_TOKEN}
            COMPOSE_FILE: docker-compose.yml
            FILESHIP_URL: http://fileship:3000

volumes:
    pg_data:
