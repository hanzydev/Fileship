packages:
  - 'apps/*'
  - 'packages/*'

supportedArchitectures:
  os:
    - win32
    - linux
    - darwin
    - wasi
  cpu:
    - x64
    - arm64
    - wasm32

overrides:
  unconfig: ^7.5.0
  sharp: ^0.35.5
  undici@7: ^7.30.1
  undici@8: ^8.12.2
  hast-util-raw@9: 9.1.0
  node-forge: ^1.4.3
  hono: ^4.13.16
  '@hono/node-server@2': ^2.1.6
  decode-uri-component@0: ^0.5.1
  glob@>=9 <14.0.2: ^14.0.2

patchedDependencies:
  source-map-resolve@0.6.0: patches/source-map-resolve@0.6.0.patch

allowBuilds:
  '@ffmpeg-installer/darwin-arm64': true
  '@ffmpeg-installer/darwin-x64': true
  '@ffmpeg-installer/linux-arm64': true
  '@ffmpeg-installer/linux-x64': true
  '@ffprobe-installer/darwin-arm64': true
  '@ffprobe-installer/darwin-x64': true
  '@ffprobe-installer/linux-arm64': true
  '@ffprobe-installer/linux-x64': true
  '@parcel/watcher': true
  '@prisma/engines': true
  argon2: true
  better-sqlite3: true
  bufferutil: true
  cpu-features: false
  electron: true
  electron-winstaller: false
  esbuild: true
  koffi: true
  onnxruntime-node: false
  prisma: true
  protobufjs: false
  sharp: true
  ssh2: false
  unrs-resolver: true
  utf-8-validate: true
  vue-demi: true
