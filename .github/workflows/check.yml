name: check
on:
    push:
    pull_request:
        branches:
            - main
permissions:
    contents: read
jobs:
    check:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v6

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'pnpm'

            - name: Install the desktop build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends libgtk-4-dev libcurl4-openssl-dev \
                      libsqlite3-dev libsecret-1-dev libpulse-dev libpipewire-0.3-dev libfuse3-dev libx11-dev \
                      libxext-dev libxfixes-dev libxrandr-dev libfontconfig-dev libwayland-dev libwayland-bin

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint & Test build
              run: pnpm check
