name: check
on:
    push:
    pull_request:
        branches:
            - main
            - next
permissions:
    contents: read
jobs:
    check:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v6

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'pnpm'

            - uses: astral-sh/setup-uv@v10.3.3

            - name: Install the native build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends libglib2.0-dev libsoup-3.0-dev libsecret-1-dev libsqlite3-dev libgdk-pixbuf-2.0-dev libxcb1-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libpulse-dev libxkbcommon-dev libpipewire-0.3-dev libgtk-4-dev

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint & Test build
              run: pnpm check

            - name: Native tests
              run: pnpm --filter desktop test
