name: Publish Docker Images to GHCR

on:
    release:
        types: [published]
    workflow_dispatch:

jobs:
    images:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - image_name: fileship-updater-agent
                      dockerfile: apps/updater-agent/Dockerfile
                    - image_name: fileship-postgres
                      dockerfile: docker/postgres/Dockerfile
                    - image_name: fileship-ml
                      dockerfile: apps/ml/Dockerfile
        permissions:
            packages: write
            contents: read
        uses: ./.github/workflows/docker-image.yml
        with:
            image_name: ${{ matrix.image_name }}
            dockerfile: ${{ matrix.dockerfile }}

    fileship:
        needs: images
        permissions:
            packages: write
            contents: read
        uses: ./.github/workflows/docker-image.yml
        with:
            image_name: fileship
            dockerfile: apps/dashboard/Dockerfile

    telemetry:
        permissions:
            packages: write
            contents: read
        uses: ./.github/workflows/docker-image.yml
        with:
            image_name: fileship-telemetry
            dockerfile: apps/telemetry/Dockerfile
