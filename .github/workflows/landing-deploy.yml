name: Deploy the landing page
on:
    push:
        branches:
            - main
        paths:
            - 'apps/landing/**'
            - 'packages/ui/**'
            - 'docs/**'
            - 'CHANGELOG.md'
            - 'pnpm-lock.yaml'
            - '.github/workflows/landing-deploy.yml'
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: landing-deploy
    cancel-in-progress: true
jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v6

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --filter landing...

            - name: Generate
              run: pnpm --filter landing generate

            - name: Deploy to Cloudflare Pages
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: npx --yes wrangler@4 pages deploy apps/landing/.output/public --project-name=fileship-landing --branch=main
