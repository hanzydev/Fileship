x-fileship: &fileship
    build:
        context: .
        dockerfile: apps/dashboard/Dockerfile
    image: ghcr.io/hanzydev/fileship:latest
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
        HOST: 0.0.0.0
        PORT: 3000
        DATABASE_URL: postgres://postgres:postgres@postgres/postgres
        UPDATER_URL: http://updater-agent:3001
        UPDATER_SECRET: ${SECRET_TOKEN:-dev-secret-token}
        NITRO_SHUTDOWN_TIMEOUT: 25000
    volumes:
        - ./data:/fileship/data
    depends_on:
        postgres:
            condition: service_healthy

services:
    postgres:
        image: postgres:16.9
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: postgres
        volumes:
            - pg_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 10s
            timeout: 5s
            retries: 5

    proxy:
        image: caddy:2-alpine
        restart: unless-stopped
        command: caddy run --config /etc/caddy/caddy.json
        ports:
            - '3000:3000'
        volumes:
            - ./caddy.json:/etc/caddy/caddy.json:ro

    fileship-blue:
        <<: *fileship

    fileship-green:
        <<: *fileship
        profiles: [green]

    updater-agent:
        build:
            context: .
            dockerfile: apps/updater-agent/Dockerfile
        restart: unless-stopped
        ports:
            - '3001:3001'
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - ./docker-compose.dev.yml:/fileship/docker-compose.dev.yml
        environment:
            DEV_MODE: true
            AUTOUPDATER_ENABLED: false
            SECRET_TOKEN: ${SECRET_TOKEN:-dev-secret-token}
            COMPOSE_FILE: docker-compose.dev.yml
            FILESHIP_URL: http://proxy:3000

volumes:
    pg_data:
